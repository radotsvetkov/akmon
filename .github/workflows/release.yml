name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate: nothing is built or published unless the tag matches the workspace
  # version and the full test + lint suite passes on the tagged commit.
  verify:
    name: Verify tag, tests, and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Tag must equal the workspace version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "akmon-cli") | .version')"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version ${VERSION} in Cargo.toml"
            exit 1
          fi
          echo "tag $TAG matches workspace version $VERSION"

      - name: Release notes exist for this tag
        run: |
          NOTES="docs/src/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::warning::$NOTES is missing; the release body will fall back to a CHANGELOG link"
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Test
        run: >
          RUSTFLAGS='-D warnings'
          cargo test --workspace
          --no-default-features

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: akmon-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: akmon-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: akmon-darwin-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: >
          cargo build --release
          --no-default-features
          --target ${{ matrix.target }}
          -p akmon-cli
          -p agef-verify

      - name: Stage for upload
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/akmon" "dist/${{ matrix.artifact }}"
          suffix="${{ matrix.artifact }}"
          suffix="${suffix#akmon-}"
          cp "target/${{ matrix.target }}/release/agef-verify" "dist/agef-verify-${suffix}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Upload BOTH the akmon and agef-verify binaries staged above (each matrix
          # row's dist/ holds exactly its two binaries). Uploading only the akmon
          # artifact left agef-verify-* missing in the release job, breaking SHA256SUMS.
          path: dist/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten binaries for the release
        run: |
          mkdir -p release-assets
          find dist -type f \( -name 'akmon-*' -o -name 'agef-verify-*' \) -exec cp -v {} release-assets/ \;
          ls -la release-assets

      # Software Bill of Materials (CycloneDX) generated from Cargo.lock so
      # downstream consumers can audit the dependency closure of each release.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-assets/akmon.cdx.json

      # SHA-256 checksums let users verify the integrity of downloaded binaries.
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum akmon-* agef-verify-* akmon.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare release notes body
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/src/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" RELEASE_NOTES.md
          else
            {
              echo "# ${TAG}"
              echo
              echo "See [CHANGELOG.md](https://github.com/radotsvetkov/akmon/blob/main/CHANGELOG.md) for full details."
            } > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          body_path: RELEASE_NOTES.md

      # The Homebrew tap (radotsvetkov/homebrew-akmon) is updated by hand from
      # SHA256SUMS; surface the exact values in the run summary so it is not forgotten.
      - name: Homebrew formula reminder
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Homebrew tap update needed"
            echo
            echo "Bump \`version \"${VERSION}\"\` and these sha256 values in"
            echo "packaging/homebrew/Formula/{akmon,agef-verify}.rb and in the radotsvetkov/homebrew-akmon tap:"
            echo
            echo '```'
            grep -E ' (akmon|agef-verify)-(darwin|linux)-' release-assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
